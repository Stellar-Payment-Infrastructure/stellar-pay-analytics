# Local stack: Postgres + aggregator + dashboard. Build context is this
# repository root because both packages share one pnpm workspace.
#   cp aggregator/.env.example aggregator/.env   # fill in API_KEYS and STATS_BEARER_TOKEN
#   ANALYTICS_TOKEN=<same value as STATS_BEARER_TOKEN> docker compose up --build
# Dashboard: http://localhost:8080
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stellar_pay_analytics
    ports:
      - "5433:5432"
    volumes:
      - analytics_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  aggregator:
    build:
      context: .
      dockerfile: aggregator/Dockerfile
    env_file: aggregator/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/stellar_pay_analytics
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      AGGREGATOR_URL: http://aggregator:4000
      # nginx adds this bearer token server-side; it never reaches the browser.
      ANALYTICS_TOKEN: ${ANALYTICS_TOKEN:?set ANALYTICS_TOKEN to the aggregator STATS_BEARER_TOKEN}
    ports:
      - "8080:8080"
    depends_on:
      - aggregator

volumes:
  analytics_postgres_data:
