name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9.15.9"

jobs:
  verify:
    name: ${{ matrix.package }} (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [aggregator, web]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --file aggregator/Dockerfile --tag stellar-pay-analytics-aggregator:ci .
      - run: docker build --file web/Dockerfile --tag stellar-pay-analytics-web:ci .
